name: Deploy Demo to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      base_path:
        description: "Vite base path for GitHub Pages project hosting"
        required: true
        default: "/Setpoint/"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: false

jobs:
  build:
    name: Build demo artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static demo
        run: npm run build:demo
        env:
          VITE_EA_DEMO_BASE: ${{ inputs.base_path }}

      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    name: Deploy demo artifact
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
