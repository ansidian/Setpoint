name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test fast suite
        run: npm run test:fast

      - name: Test slow integrations
        run: npm run test:slow

      - name: Check agent harness
        run: npm run check:harness
        env:
          TEST_ARCHITECTURE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Build
        run: npm run build
