user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
# Nginx error messages can include the complete request query (webhook secrets).
error_log /dev/null;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # No request URI, query, referrer, headers, or body in logs.
    log_format safe '$time_iso8601 status=$status bytes=$body_bytes_sent duration=$request_time';
    access_log /dev/stdout safe;
    sendfile on;
    keepalive_timeout 65;
    client_body_timeout 30s;
    client_max_body_size 11m;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 120s;

    # Check raw URI as well as nginx's decoded/normalized location matching.
    map "$request_method:$request_uri" $allowed_webhook {
        default 0;
        ~^POST:/api/gmail/push(\?.*)?$ 1;
        ~^POST:/api/calendar/push(\?.*)?$ 1;
        ~^POST:/api/todoist/webhook(\?.*)?$ 1;
    }
    server {
        listen 100.64.0.10:443 ssl default_server;
        server_name setpoint.example.com;
        ssl_certificate /etc/letsencrypt/live/setpoint.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/setpoint.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        if ($host != setpoint.example.com) { return 404; }
        location / {
            proxy_pass http://127.0.0.1:3001;
        }
    }
    server {
        listen 127.0.0.1:18765;
        server_name _;
        client_max_body_size 1m;
        proxy_read_timeout 60s;
        if ($allowed_webhook = 0) { return 404; }
        location = /api/gmail/push { proxy_pass http://127.0.0.1:3001; }
        location = /api/calendar/push { proxy_pass http://127.0.0.1:3001; }
        location = /api/todoist/webhook { proxy_pass http://127.0.0.1:3001; }
        location / { return 404; }
    }
}
