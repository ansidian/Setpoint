name: setpoint
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: '3'
services:
  app:
    profiles: [production]
    image: setpoint-selfhosted:local
    build:
      context: ..
    network_mode: host
    init: true
    user: '1000:1000'
    env_file:
      - path: ${SETPOINT_RUNTIME_ENV:-/srv/setpoint/runtime.env}
        format: raw
    environment:
      NODE_ENV: production
      EA_DB_ADAPTER: sqlite
      EA_SQLITE_PATH: /data/db/setpoint.db
      EA_BIND_HOST: 127.0.0.1
      PORT: '3001'
      EA_SERVER_PORT: '3001'
      TRUST_PROXY: loopback
      EA_TLDRAW_ASSET_DIR: /data/notes
      ACTUAL_DATA_DIR: /data/actual
      EA_WEBHOOK_ORIGIN: https://server.example-tailnet.ts.net:8443
    volumes:
      - type: bind
        source: ${SETPOINT_ROOT:-/srv/setpoint}/data
        target: /data
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 120s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/healthz',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging: *logging
  nginx:
    profiles: [production]
    image: nginx:1.30.5-alpine@sha256:ef8676b33d681f272ba429b27658bdd7e640963279714c96bddf1dc76307f7b6
    network_mode: host
    entrypoint: [nginx]
    command: [-g, 'daemon off;']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - type: bind
        source: ${SETPOINT_ROOT:-/srv/setpoint}/letsencrypt
        target: /etc/letsencrypt
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=64m
      - /var/run:rw,nosuid,nodev,size=1m
      - /tmp:rw,nosuid,nodev,size=16m
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 120s
    logging: *logging
  certbot:
    profiles: [certificate]
    image: certbot/dns-digitalocean:v5.8.0@sha256:bf3033914b07a5cf01e863d8c53a7d2ab13f52ea3b5a6e0356844ede06ef1a74
    volumes:
      - type: bind
        source: ${SETPOINT_ROOT:-/srv/setpoint}/letsencrypt
        target: /etc/letsencrypt
        bind:
          create_host_path: false
      - type: bind
        source: ${SETPOINT_ROOT:-/srv/setpoint}/certbot-work
        target: /var/lib/letsencrypt
        bind:
          create_host_path: false
      - type: bind
        source: ${SETPOINT_ROOT:-/srv/setpoint}/secrets/digitalocean.ini
        target: /run/secrets/digitalocean.ini
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /var/log/letsencrypt:rw,nosuid,nodev,size=16m
      - /tmp:rw,nosuid,nodev,size=16m
    command: [--version]
    logging: *logging
